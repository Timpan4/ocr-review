name: ocr-review

# OpenCodeReview (OCR) on the wall-e review runners, using the owner's Sign in
# with ChatGPT session. Callers trigger on pull_request; see README.md.
on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ocr-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  OCR_VERSION: v1.13.3
  OCR_SHA256: 843be0e56fdff0a5ca6f86c5866f942d6a372dff1c0ca19e7893d72495abf45c
  # scripts/github-actions/post-review-comments.js at OCR_VERSION.
  OCR_POSTER_SHA256: 1d5decf90627353f1e7a2cad291d4ee4ec0a661d9724b93b2d7d5246f33462e2

jobs:
  review:
    # Same-repository PRs only: fork PRs never reach the self-hosted runner from
    # here. Kargo promotion PRs only bump a version.
    if: >-
      github.event.pull_request && !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'kargo/promotion/')
    runs-on: wall-e-review
    # Owner choice in wall-e-infra docs/code-review.md.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install OCR
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/ocr-bin"
          mkdir -p "$bin"
          base="https://github.com/alibaba/open-code-review"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "$base/releases/download/$OCR_VERSION/opencodereview-linux-amd64" --output "$bin/ocr"
          printf '%s  %s\n' "$OCR_SHA256" "$bin/ocr" | sha256sum --check >/dev/null
          chmod 0755 "$bin/ocr"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://raw.githubusercontent.com/alibaba/open-code-review/$OCR_VERSION/scripts/github-actions/post-review-comments.js" \
            --output "$RUNNER_TEMP/post-review-comments.js"
          printf '%s  %s\n' "$OCR_POSTER_SHA256" "$RUNNER_TEMP/post-review-comments.js" | sha256sum --check >/dev/null
          echo "$bin" >>"$GITHUB_PATH"

      # Shared settings come from settings.json on main, not from the workflow
      # ref, so a change applies to the next review without moving v1. The
      # ocr.timpan.dev settings page commits that file. Anything unexpected
      # fails the job instead of falling back to defaults.
      - name: Load settings
        id: settings
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { data } = await github.rest.repos.getContent({
              owner: 'Timpan4', repo: 'ocr-review', path: 'settings.json', ref: 'main',
              mediaType: { format: 'raw' },
            });
            const s = JSON.parse(data);
            const fail = (msg) => { throw new Error(`Timpan4/ocr-review settings.json: ${msg}`); };
            const keys = ['model', 'effort', 'noFilter', 'exclude', 'maxTokensBudget', 'timeoutMinutes'];
            if (s === null || typeof s !== 'object' || Array.isArray(s)) fail('must be a JSON object');
            for (const k of Object.keys(s)) if (!keys.includes(k)) fail(`unknown key ${k}`);
            for (const k of keys) if (!(k in s)) fail(`missing key ${k}`);
            if (typeof s.model !== 'string' || !/^[A-Za-z0-9][A-Za-z0-9._:\/-]*$/.test(s.model)) fail('model must be a model name');
            if (!['', 'low', 'medium', 'high'].includes(s.effort)) fail('effort must be "", low, medium or high');
            if (typeof s.noFilter !== 'boolean') fail('noFilter must be true or false');
            // Commas would split the --exclude value; control characters include NUL,
            // which would split ocr-args into extra arguments.
            if (!Array.isArray(s.exclude) || !s.exclude.every((p) => typeof p === 'string' && p !== '' && !/[,\x00-\x1f\x7f]/.test(p))) {
              fail('exclude must be a list of patterns without commas or control characters');
            }
            for (const k of ['maxTokensBudget', 'timeoutMinutes']) {
              if (!Number.isSafeInteger(s[k]) || s[k] < 0) fail(`${k} must be a whole number, 0 or more`);
            }
            // This job's timeout-minutes. A longer group timeout can never fire, and much
            // larger values overflow OCR's duration and disable the timeout.
            if (s.timeoutMinutes > 60) fail('timeoutMinutes must be at most 60, the job timeout');
            // Flags only for non-default values, so defaults behave like OCR's own.
            // --timeout is always passed: omitting it means OCR's 15, not 0 (unlimited).
            const args = ['--timeout', String(s.timeoutMinutes)];
            if (s.effort) args.push('--effort', s.effort);
            if (s.noFilter) args.push('--no-filter');
            if (s.exclude.length) args.push('--exclude', s.exclude.join(','));
            if (s.maxTokensBudget) args.push('--max-tokens-budget', String(s.maxTokensBudget));
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/ocr-args`, args.map((a) => `${a}\0`).join(''));
            core.setOutput('model', s.model);
            core.info(`model=${s.model} extra flags: ${args.join(' ') || '(none)'}`);

      - name: Configure OCR
        env:
          OCR_MODEL: ${{ steps.settings.outputs.model }}
        run: |
          set -euo pipefail
          ocr config set provider chatgpt
          ocr config set providers.chatgpt.model "$OCR_MODEL"

      - name: Run OCR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -d '' -t extra <"$RUNNER_TEMP/ocr-args"
          set +e
          ocr review --from "$BASE_SHA" --to "$HEAD_SHA" --audience agent --format json "${extra[@]}" \
            >"$RUNNER_TEMP/ocr-result.json" 2>"$RUNNER_TEMP/ocr-stderr.log"
          code=$?
          set -e
          echo "OCR_EXIT_CODE=$code" >>"$GITHUB_ENV"
          cat "$RUNNER_TEMP/ocr-stderr.log" >&2

      - name: Post review comments
        if: env.OCR_EXIT_CODE == '0'
        uses: actions/github-script@v9
        env:
          OCR_PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const fs = require('fs');
            const temp = process.env.RUNNER_TEMP;
            const { runPostReviewComments } = require(`${temp}/post-review-comments.js`);
            await runPostReviewComments({
              github,
              context,
              core,
              fs,
              prNumber: Number(process.env.OCR_PR_NUMBER),
              resultPath: `${temp}/ocr-result.json`,
              stderrPath: `${temp}/ocr-stderr.log`,
            });

      - name: Fail on review error
        if: env.OCR_EXIT_CODE != '0'
        run: |
          echo "::error::ocr review exited with $OCR_EXIT_CODE; see the Run OCR step log."
          exit 1
