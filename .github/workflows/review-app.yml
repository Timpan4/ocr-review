name: ocr-review-app

# OpenCodeReview (OCR) for a pull request in any Timpan4 repository where the
# reviewer GitHub App is installed, with no workflow file in that repository.
# wall-e-infra's ocr-dispatch.yml calls this when ocr-dispatch receives the
# App's pull_request webhook; see README.md.
on:
  workflow_call:
    inputs:
      repository:
        description: Repository of the pull request, owner/name.
        type: string
        required: true
      pr_number:
        description: Pull request number.
        type: string
        required: true
      head_sha:
        description: Head commit the webhook reported. A newer head skips this run.
        type: string
        required: true
    secrets:
      reviewer-client-id:
        description: Client ID of the reviewer GitHub App.
        required: true
      reviewer-private-key:
        description: Private key of the reviewer GitHub App.
        required: true

permissions:
  contents: read

# A newer push to the same pull request replaces a review still in progress.
concurrency:
  group: ocr-review-app-${{ inputs.repository }}-${{ inputs.pr_number }}
  cancel-in-progress: true

env:
  OCR_VERSION: v1.13.3
  OCR_SHA256: 843be0e56fdff0a5ca6f86c5866f942d6a372dff1c0ca19e7893d72495abf45c
  # scripts/github-actions/post-review-comments.js at OCR_VERSION.
  OCR_POSTER_SHA256: 1d5decf90627353f1e7a2cad291d4ee4ec0a661d9724b93b2d7d5246f33462e2

jobs:
  review:
    runs-on: wall-e-review
    # Owner choice in wall-e-infra docs/code-review.md.
    timeout-minutes: 60
    steps:
      # The inputs come from a webhook relay, so they are checked before any
      # of them reaches a token request, an API path, or a shell.
      - name: Check inputs
        id: target
        env:
          REPOSITORY: ${{ inputs.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" =~ ^Timpan4/([A-Za-z0-9._-]+)$ ]] || { echo "::error::repository must be Timpan4/<name>"; exit 1; }
          name="${BASH_REMATCH[1]}"
          # "." and ".." pass the pattern but would rewrite later API paths.
          [[ "$name" != "." && "$name" != ".." ]] || { echo "::error::repository must be Timpan4/<name>"; exit 1; }
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]] || { echo "::error::pr_number must be a positive integer"; exit 1; }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head_sha must be a 40-character commit SHA"; exit 1; }
          echo "name=$name" >>"$GITHUB_OUTPUT"

      # A token for the one repository under review: read its code, write
      # review comments.
      - name: Reviewer token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.reviewer-client-id }}
          private-key: ${{ secrets.reviewer-private-key }}
          owner: Timpan4
          repositories: ${{ steps.target.outputs.name }}
          permission-contents: read
          permission-pull-requests: write

      # The receiver's skip rules again, applied to the pull request as it is
      # now rather than to the webhook payload.
      - name: Check pull request
        id: pr
        uses: actions/github-script@v9
        env:
          REPO_NAME: ${{ steps.target.outputs.name }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const repo = process.env.REPO_NAME;
            const { data: pr } = await github.rest.pulls.get({
              owner: 'Timpan4', repo, pull_number: Number(process.env.PR_NUMBER),
            });
            const skip = (reason) => {
              core.notice(`Skipping Timpan4/${repo}#${pr.number}: ${reason}.`);
              core.setOutput('review', 'false');
            };
            if (pr.state !== 'open') return skip('not open');
            if (pr.draft) return skip('draft');
            // Fork pull requests never reach the self-hosted runner.
            if (pr.head.repo?.full_name !== pr.base.repo.full_name) return skip('head is not in the base repository');
            // Kargo promotion pull requests only bump a version.
            if (pr.head.ref.startsWith('kargo/promotion/')) return skip('Kargo promotion');
            if (pr.head.sha !== process.env.HEAD_SHA) return skip(`head moved to ${pr.head.sha}`);
            core.setOutput('review', 'true');
            core.setOutput('base_sha', pr.base.sha);

      - uses: actions/checkout@v7
        if: steps.pr.outputs.review == 'true'
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.head_sha }}
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install OCR
        if: steps.pr.outputs.review == 'true'
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/ocr-bin"
          mkdir -p "$bin"
          base="https://github.com/alibaba/open-code-review"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "$base/releases/download/$OCR_VERSION/opencodereview-linux-amd64" --output "$bin/ocr"
          printf '%s  %s\n' "$OCR_SHA256" "$bin/ocr" | sha256sum --check >/dev/null
          chmod 0755 "$bin/ocr"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://raw.githubusercontent.com/alibaba/open-code-review/$OCR_VERSION/scripts/github-actions/post-review-comments.js" \
            --output "$RUNNER_TEMP/post-review-comments.js"
          printf '%s  %s\n' "$OCR_POSTER_SHA256" "$RUNNER_TEMP/post-review-comments.js" | sha256sum --check >/dev/null
          echo "$bin" >>"$GITHUB_PATH"

      # Shared settings come from settings.json on main, not from the workflow
      # ref, so a change applies to the next review without moving v1. The
      # ocr.timpan.dev settings page commits that file. Anything unexpected
      # fails the job instead of falling back to defaults.
      - name: Load settings
        id: settings
        if: steps.pr.outputs.review == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { data } = await github.rest.repos.getContent({
              owner: 'Timpan4', repo: 'ocr-review', path: 'settings.json', ref: 'main',
              mediaType: { format: 'raw' },
            });
            const s = JSON.parse(data);
            const fail = (msg) => { throw new Error(`Timpan4/ocr-review settings.json: ${msg}`); };
            const keys = ['model', 'effort', 'noFilter', 'exclude', 'maxTokensBudget', 'timeoutMinutes'];
            if (s === null || typeof s !== 'object' || Array.isArray(s)) fail('must be a JSON object');
            for (const k of Object.keys(s)) if (!keys.includes(k)) fail(`unknown key ${k}`);
            for (const k of keys) if (!(k in s)) fail(`missing key ${k}`);
            if (typeof s.model !== 'string' || !/^[A-Za-z0-9][A-Za-z0-9._:\/-]*$/.test(s.model)) fail('model must be a model name');
            if (!['', 'low', 'medium', 'high'].includes(s.effort)) fail('effort must be "", low, medium or high');
            if (typeof s.noFilter !== 'boolean') fail('noFilter must be true or false');
            // Commas would split the --exclude value; control characters include NUL,
            // which would split ocr-args into extra arguments.
            if (!Array.isArray(s.exclude) || !s.exclude.every((p) => typeof p === 'string' && p !== '' && !/[,\x00-\x1f\x7f]/.test(p))) {
              fail('exclude must be a list of patterns without commas or control characters');
            }
            for (const k of ['maxTokensBudget', 'timeoutMinutes']) {
              if (!Number.isSafeInteger(s[k]) || s[k] < 0) fail(`${k} must be a whole number, 0 or more`);
            }
            // This job's timeout-minutes. A longer group timeout can never fire, and much
            // larger values overflow OCR's duration and disable the timeout.
            if (s.timeoutMinutes > 60) fail('timeoutMinutes must be at most 60, the job timeout');
            // Flags only for non-default values, so defaults behave like OCR's own.
            // --timeout is always passed: omitting it means OCR's 15, not 0 (unlimited).
            const args = ['--timeout', String(s.timeoutMinutes)];
            if (s.effort) args.push('--effort', s.effort);
            if (s.noFilter) args.push('--no-filter');
            if (s.exclude.length) args.push('--exclude', s.exclude.join(','));
            if (s.maxTokensBudget) args.push('--max-tokens-budget', String(s.maxTokensBudget));
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/ocr-args`, args.map((a) => `${a}\0`).join(''));
            core.setOutput('model', s.model);
            core.info(`model=${s.model} extra flags: ${args.join(' ') || '(none)'}`);

      - name: Configure OCR
        if: steps.pr.outputs.review == 'true'
        env:
          OCR_MODEL: ${{ steps.settings.outputs.model }}
        run: |
          set -euo pipefail
          ocr config set provider chatgpt
          ocr config set providers.chatgpt.model "$OCR_MODEL"

      - name: Run OCR
        if: steps.pr.outputs.review == 'true'
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          mapfile -d '' -t extra <"$RUNNER_TEMP/ocr-args"
          set +e
          ocr review --from "$BASE_SHA" --to "$HEAD_SHA" --audience agent --format json "${extra[@]}" \
            >"$RUNNER_TEMP/ocr-result.json" 2>"$RUNNER_TEMP/ocr-stderr.log"
          code=$?
          set -e
          echo "OCR_EXIT_CODE=$code" >>"$GITHUB_ENV"
          cat "$RUNNER_TEMP/ocr-stderr.log" >&2

      - name: Post review comments
        if: steps.pr.outputs.review == 'true' && env.OCR_EXIT_CODE == '0'
        uses: actions/github-script@v9
        env:
          OCR_PR_NUMBER: ${{ inputs.pr_number }}
          REPO_NAME: ${{ steps.target.outputs.name }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const fs = require('fs');
            const temp = process.env.RUNNER_TEMP;
            const { runPostReviewComments } = require(`${temp}/post-review-comments.js`);
            const prNumber = Number(process.env.OCR_PR_NUMBER);
            // The poster reads the target from context.repo and context.issue,
            // which are getters on the Actions context and point at the calling
            // repository. Spreading copies the plain fields (runId, eventName,
            // payload) and the target is set explicitly.
            const target = { owner: 'Timpan4', repo: process.env.REPO_NAME };
            const reviewContext = { ...context, repo: target, issue: { ...target, number: prNumber } };
            // incremental recognizes earlier OCR comments by the authenticated
            // login, which an App installation token cannot read. Without this,
            // only github-actions[bot] comments count and every push repeats
            // the App's own findings.
            const login = `${process.env.APP_SLUG}[bot]`;
            const reviewer = {
              ...github,
              rest: {
                ...github.rest,
                users: { ...github.rest.users, getAuthenticated: async () => ({ data: { login } }) },
              },
            };
            await runPostReviewComments({
              github: reviewer,
              context: reviewContext,
              core,
              fs,
              prNumber,
              resultPath: `${temp}/ocr-result.json`,
              stderrPath: `${temp}/ocr-stderr.log`,
              // Skip findings on lines an earlier OCR comment on this PR already
              // covers, resolved or not, so a later push does not raise them again.
              incremental: true,
              // Performance findings without a measurement went unfixed, so they
              // go to the summary instead of inline threads.
              routeCategories: 'performance',
            });

      - name: Fail on review error
        if: steps.pr.outputs.review == 'true' && env.OCR_EXIT_CODE != '0'
        run: |
          echo "::error::ocr review exited with $OCR_EXIT_CODE; see the Run OCR step log."
          exit 1
