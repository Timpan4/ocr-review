name: ocr-review-app

# OpenCodeReview (OCR) for a pull request in any Timpan4 repository where the
# reviewer GitHub App is installed, with no workflow file in that repository.
# wall-e-infra's ocr-dispatch.yml calls this when ocr-dispatch receives the
# App's pull_request webhook; see README.md.
on:
  workflow_call:
    inputs:
      repository:
        description: Repository of the pull request, owner/name.
        type: string
        required: true
      pr_number:
        description: Pull request number.
        type: string
        required: true
      head_sha:
        description: Head commit the webhook reported. A newer head skips this run.
        type: string
        required: true
    secrets:
      reviewer-client-id:
        description: Client ID of the reviewer GitHub App.
        required: true
      reviewer-private-key:
        description: Private key of the reviewer GitHub App.
        required: true

permissions:
  contents: read

# A newer push to the same pull request replaces a review still in progress.
concurrency:
  group: ocr-review-app-${{ inputs.repository }}-${{ inputs.pr_number }}
  cancel-in-progress: true

env:
  OCR_VERSION: v1.13.12
  OCR_SHA256: 673ed6bfd905bf68383269e78945b9d873a5c8c0931fce6e86374ca58df0b8b1
  # scripts/github-actions/post-review-comments.js at OCR_VERSION.
  OCR_POSTER_SHA256: 073f917f2ae9b4c13aef840043957fa087efb45e75d551a277506833dabcf294
  # OCR sets prompt_cache_key per conversation, but the ChatGPT backend missed
  # the cache on most follow-up calls until each request also carried the
  # conversation key as a session_id header, as Codex sends. OCR expands
  # {ocr_session_key} itself.
  OCR_EXTRA_HEADERS: 'session_id={ocr_session_key}'
  # Performance findings without a measurement went unfixed, so they go to the
  # summary instead of inline threads.
  OCR_ROUTE_CATEGORIES: performance

jobs:
  review:
    runs-on: wall-e-review
    # Owner choice in wall-e-infra docs/code-review.md.
    timeout-minutes: 60
    steps:
      # The inputs come from a webhook relay, so they are checked before any
      # of them reaches a token request, an API path, or a shell.
      - name: Check inputs
        id: target
        env:
          REPOSITORY: ${{ inputs.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" =~ ^Timpan4/([A-Za-z0-9._-]+)$ ]] || { echo "::error::repository must be Timpan4/<name>"; exit 1; }
          name="${BASH_REMATCH[1]}"
          # "." and ".." pass the pattern but would rewrite later API paths.
          [[ "$name" != "." && "$name" != ".." ]] || { echo "::error::repository must be Timpan4/<name>"; exit 1; }
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]] || { echo "::error::pr_number must be a positive integer"; exit 1; }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head_sha must be a 40-character commit SHA"; exit 1; }
          echo "name=$name" >>"$GITHUB_OUTPUT"

      # A token for the one repository under review: read its code, write
      # review comments.
      - name: Reviewer token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.reviewer-client-id }}
          private-key: ${{ secrets.reviewer-private-key }}
          owner: Timpan4
          repositories: ${{ steps.target.outputs.name }}
          permission-contents: read
          permission-pull-requests: write

      # The receiver's skip rules again, applied to the pull request as it is
      # now rather than to the webhook payload.
      - name: Check pull request
        id: pr
        uses: actions/github-script@v9
        env:
          REPO_NAME: ${{ steps.target.outputs.name }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const repo = process.env.REPO_NAME;
            const { data: pr } = await github.rest.pulls.get({
              owner: 'Timpan4', repo, pull_number: Number(process.env.PR_NUMBER),
            });
            const skip = (reason) => {
              core.notice(`Skipping Timpan4/${repo}#${pr.number}: ${reason}.`);
              core.setOutput('review', 'false');
            };
            if (pr.state !== 'open') return skip('not open');
            if (pr.draft) return skip('draft');
            // Fork pull requests never reach the self-hosted runner.
            if (pr.head.repo?.full_name !== pr.base.repo.full_name) return skip('head is not in the base repository');
            // Kargo promotion pull requests only bump a version.
            if (pr.head.ref.startsWith('kargo/promotion/')) return skip('Kargo promotion');
            if (pr.head.sha !== process.env.HEAD_SHA) return skip(`head moved to ${pr.head.sha}`);
            core.setOutput('review', 'true');
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('base_ref', pr.base.ref);

      - uses: actions/checkout@v7
        if: steps.pr.outputs.review == 'true'
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.head_sha }}
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install OCR
        if: steps.pr.outputs.review == 'true'
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/ocr-bin"
          mkdir -p "$bin"
          base="https://github.com/alibaba/open-code-review"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "$base/releases/download/$OCR_VERSION/opencodereview-linux-amd64" --output "$bin/ocr"
          printf '%s  %s\n' "$OCR_SHA256" "$bin/ocr" | sha256sum --check >/dev/null
          chmod 0755 "$bin/ocr"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://raw.githubusercontent.com/alibaba/open-code-review/$OCR_VERSION/scripts/github-actions/post-review-comments.js" \
            --output "$RUNNER_TEMP/post-review-comments.js"
          printf '%s  %s\n' "$OCR_POSTER_SHA256" "$RUNNER_TEMP/post-review-comments.js" | sha256sum --check >/dev/null
          echo "$bin" >>"$GITHUB_PATH"

      # Shared settings come from settings.json on main, not from the workflow
      # ref, so a change applies to the next review without moving v1. The
      # ocr.timpan.dev settings page commits that file. Anything unexpected
      # fails the job instead of falling back to defaults.
      - name: Load settings
        id: settings
        if: steps.pr.outputs.review == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { data } = await github.rest.repos.getContent({
              owner: 'Timpan4', repo: 'ocr-review', path: 'settings.json', ref: 'main',
              mediaType: { format: 'raw' },
            });
            const s = JSON.parse(data);
            const fail = (msg) => { throw new Error(`Timpan4/ocr-review settings.json: ${msg}`); };
            const keys = ['model', 'effort', 'noFilter', 'exclude', 'include', 'maxTokensBudget', 'timeoutMinutes'];
            if (s === null || typeof s !== 'object' || Array.isArray(s)) fail('must be a JSON object');
            // Rollout: this workflow is released before settings.json on main gains
            // include, so a missing include reads as []. See README.md, Releases.
            if (!('include' in s)) s.include = [];
            for (const k of Object.keys(s)) if (!keys.includes(k)) fail(`unknown key ${k}`);
            for (const k of keys) if (!(k in s)) fail(`missing key ${k}`);
            if (typeof s.model !== 'string' || !/^[A-Za-z0-9][A-Za-z0-9._:\/-]*$/.test(s.model)) fail('model must be a model name');
            if (!['', 'low', 'medium', 'high'].includes(s.effort)) fail('effort must be "", low, medium or high');
            if (typeof s.noFilter !== 'boolean') fail('noFilter must be true or false');
            // Commas would split the --exclude value; control characters include NUL,
            // which would split ocr-args into extra arguments. include follows the
            // same rule so both lists accept the same patterns.
            for (const k of ['exclude', 'include']) {
              if (!Array.isArray(s[k]) || !s[k].every((p) => typeof p === 'string' && p !== '' && !/[,\x00-\x1f\x7f]/.test(p))) {
                fail(`${k} must be a list of patterns without commas or control characters`);
              }
            }
            for (const k of ['maxTokensBudget', 'timeoutMinutes']) {
              if (!Number.isSafeInteger(s[k]) || s[k] < 0) fail(`${k} must be a whole number, 0 or more`);
            }
            // This job's timeout-minutes. A longer group timeout can never fire, and much
            // larger values overflow OCR's duration and disable the timeout.
            if (s.timeoutMinutes > 60) fail('timeoutMinutes must be at most 60, the job timeout');
            // Flags only for non-default values, so defaults behave like OCR's own.
            // --timeout is always passed: omitting it means OCR's 15, not 0 (unlimited).
            const args = ['--timeout', String(s.timeoutMinutes)];
            if (s.effort) args.push('--effort', s.effort);
            if (s.noFilter) args.push('--no-filter');
            if (s.exclude.length) args.push('--exclude', s.exclude.join(','));
            if (s.maxTokensBudget) args.push('--max-tokens-budget', String(s.maxTokensBudget));
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/ocr-args`, args.map((a) => `${a}\0`).join(''));
            // OCR has no include flag. It reads $HOME/.opencodereview/rule.json as
            // its global rule layer, and include patterns there let files past its
            // extension allowlist, such as Markdown. Later steps run ocr with this
            // same HOME; on the wall-e runners that directory is a per-pod emptyDir.
            // A repository's own .opencodereview/rule.json with a non-empty include
            // or exclude replaces this layer.
            if (s.include.length) {
              const home = process.env.HOME;
              if (!home) fail('include needs HOME to locate ~/.opencodereview/rule.json');
              const dir = path.join(home, '.opencodereview');
              fs.mkdirSync(dir, { recursive: true });
              fs.writeFileSync(path.join(dir, 'rule.json'), `${JSON.stringify({ include: s.include }, null, 2)}\n`);
            }
            core.setOutput('model', s.model);
            // Every setting changes what a review would say, so all of them feed
            // the review checkpoint's fingerprint, in a fixed key order.
            core.setOutput('fingerprint_input', JSON.stringify(keys.map((k) => s[k])));
            core.info(`model=${s.model} extra flags: ${args.join(' ') || '(none)'} include: ${s.include.join(' ') || '(none)'}`);

      - name: Configure OCR
        if: steps.pr.outputs.review == 'true'
        env:
          OCR_MODEL: ${{ steps.settings.outputs.model }}
        run: |
          set -euo pipefail
          ocr config set provider chatgpt
          ocr config set providers.chatgpt.model "$OCR_MODEL"
          ocr config set providers.chatgpt.extra_headers "$OCR_EXTRA_HEADERS"

      # A complete review records the head it covered as a checkpoint in the
      # sticky summary comment, and the next push reviews only the commits
      # since. Whenever that is in doubt, the review covers the whole pull
      # request as before. See README.md, Review range.
      - name: Resolve review range
        id: range
        if: steps.pr.outputs.review == 'true'
        uses: actions/github-script@v9
        env:
          REPO_NAME: ${{ steps.target.outputs.name }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          SETTINGS: ${{ steps.settings.outputs.fingerprint_input }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const { spawnSync } = require('child_process');
            const emit = (range, mergeBase, fingerprint, carry) => {
              core.setOutput('mode', range.mode);
              core.setOutput('reason', range.reason);
              // Empty in full mode, so Run OCR falls back to the base.
              core.setOutput('from', range.mode === 'checkpoint' ? range.from : '');
              core.setOutput('merge_base', mergeBase);
              core.setOutput('fingerprint', fingerprint);
              // The marker read from the summary, re-emitted by a run that does
              // not advance it.
              core.setOutput('carry', carry);
              if (range.reason === 'same_head_noop') {
                core.notice(`Nothing to review: the checkpoint already covers ${range.to.slice(0, 7)}.`);
              } else if (range.mode === 'checkpoint') {
                core.notice(`Reviewing ${range.from.slice(0, 7)}..${range.to.slice(0, 7)} only (checkpoint ${range.reason}).`);
              } else {
                core.notice(`Reviewing the whole pull request (${range.reason}).`);
              }
            };
            // Every failure here has the same safe answer, a full review, so
            // nothing in this step fails the job. An empty fingerprint also
            // stops the poster from recording a checkpoint.
            try {
              const { readCheckpointComment, resolveCheckpointRange } =
                require(`${process.env.RUNNER_TEMP}/post-review-comments.js`);
              const git = (...args) => spawnSync('git', args, { cwd: process.env.GITHUB_WORKSPACE, encoding: 'utf8' });
              // The merge-base, not the base head: main moving on does not change
              // what the pull request adds, while a merge of main into the branch
              // or a new base does, and then the checkpoint reports base_changed.
              const mb = git('merge-base', process.env.BASE_SHA, process.env.HEAD_SHA);
              const mergeBase = mb.status === 0 ? mb.stdout.trim() : '';
              if (!/^[0-9a-f]{40}$/.test(mergeBase)) {
                throw new Error(`git merge-base exited ${mb.status}: ${(mb.stderr || mb.error?.message || '').trim()}`);
              }
              // OCR also reads the repository's own .opencodereview/rule.json.
              // A read error throws, which reviews everything.
              const rulePath = path.join(process.env.GITHUB_WORKSPACE, '.opencodereview', 'rule.json');
              const ruleDigest = fs.existsSync(rulePath)
                ? crypto.createHash('sha256').update(fs.readFileSync(rulePath)).digest('hex')
                : 'none';
              // Everything that changes what a review would say. A change to any
              // of it reviews the whole pull request once (config_changed). JSON
              // keeps the field boundaries unambiguous.
              const fingerprint = crypto.createHash('sha256').update(JSON.stringify([
                process.env.SETTINGS,
                process.env.OCR_VERSION,
                process.env.OCR_EXTRA_HEADERS,
                process.env.OCR_ROUTE_CATEGORIES,
                ruleDigest,
              ])).digest('hex').slice(0, 16);
              const common = {
                github,
                owner: 'Timpan4',
                repo: process.env.REPO_NAME,
                prNumber: Number(process.env.PR_NUMBER),
                // Only a summary this App wrote can carry a checkpoint.
                appSlug: process.env.APP_SLUG,
                log: (m) => core.info(m),
              };
              const existing = await readCheckpointComment(common);
              const range = await resolveCheckpointRange({
                ...common,
                read: existing,
                enabled: true,
                sticky: true,
                headSha: process.env.HEAD_SHA,
                baseRef: process.env.BASE_REF,
                mergeBase,
                fingerprint,
                // git's own verdict: 0 ancestor, 1 not (a rebase or force-push),
                // 128 unknown object. Anything but 0 reviews everything.
                isAncestor: (a, b) => git('merge-base', '--is-ancestor', a, b).status,
              });
              emit(range, mergeBase, fingerprint, existing.raw || '');
            } catch (e) {
              core.warning(`Could not resolve a review range (${e.message}); reviewing the whole pull request.`);
              emit({ mode: 'full', reason: 'resolver_error', from: '', to: process.env.HEAD_SHA }, '', '', '');
            }

      - name: Run OCR
        if: steps.pr.outputs.review == 'true'
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          RANGE_FROM: ${{ steps.range.outputs.from }}
          RANGE_REASON: ${{ steps.range.outputs.reason }}
        run: |
          # The checkpoint already covers this head, as on a rerun, so there is
          # nothing new to review and the summary stays as it is.
          if [ "$RANGE_REASON" = same_head_noop ]; then
            echo "OCR_EXIT_CODE=0" >>"$GITHUB_ENV"
            exit 0
          fi
          mapfile -d '' -t extra <"$RUNNER_TEMP/ocr-args"
          set +e
          # OCR reviews merge-base(from, to)..to, so the base sha reviews the
          # whole pull request and a checkpoint, an ancestor of the head,
          # reviews only the commits after it.
          ocr review --from "${RANGE_FROM:-$BASE_SHA}" --to "$HEAD_SHA" --audience agent --format json "${extra[@]}" \
            >"$RUNNER_TEMP/ocr-result.json" 2>"$RUNNER_TEMP/ocr-stderr.log"
          code=$?
          set -e
          echo "OCR_EXIT_CODE=$code" >>"$GITHUB_ENV"
          cat "$RUNNER_TEMP/ocr-stderr.log" >&2

      - name: Post review comments
        if: steps.pr.outputs.review == 'true'
        uses: actions/github-script@v9
        env:
          OCR_PR_NUMBER: ${{ inputs.pr_number }}
          REPO_NAME: ${{ steps.target.outputs.name }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          RANGE_MODE: ${{ steps.range.outputs.mode }}
          RANGE_REASON: ${{ steps.range.outputs.reason }}
          RANGE_FROM: ${{ steps.range.outputs.from }}
          MERGE_BASE: ${{ steps.range.outputs.merge_base }}
          CHECKPOINT_FINGERPRINT: ${{ steps.range.outputs.fingerprint }}
          CHECKPOINT_CARRY: ${{ steps.range.outputs.carry }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const fs = require('fs');
            const temp = process.env.RUNNER_TEMP;
            // Since OCR v1.13.12, a review where some files failed on timeouts or
            // provider errors exits non-zero. Post what such a partial review
            // found; the next step still fails the job. Any other non-zero exit
            // posts nothing, as before.
            if (process.env.OCR_EXIT_CODE !== '0') {
              let state;
              try {
                state = JSON.parse(fs.readFileSync(`${temp}/ocr-result.json`, 'utf8')).manifest?.terminal_state;
              } catch {
                state = undefined;
              }
              if (state !== 'partial') {
                core.info(`Not posting: ocr review exited ${process.env.OCR_EXIT_CODE} with terminal_state ${state ?? 'unknown'}.`);
                return;
              }
            }
            const { runPostReviewComments, findExistingSummaryComment } = require(`${temp}/post-review-comments.js`);
            const prNumber = Number(process.env.OCR_PR_NUMBER);
            // The poster reads the target from context.repo and context.issue,
            // which are getters on the Actions context and point at the calling
            // repository. Spreading copies the plain fields (runId, eventName,
            // payload) and the target is set explicitly.
            const target = { owner: 'Timpan4', repo: process.env.REPO_NAME };
            const reviewContext = { ...context, repo: target, issue: { ...target, number: prNumber } };
            // incremental recognizes earlier OCR comments by the authenticated
            // login, which an App installation token cannot read. Without this,
            // only github-actions[bot] comments count and every push repeats
            // the App's own findings.
            const login = `${process.env.APP_SLUG}[bot]`;
            const reviewer = {
              ...github,
              rest: {
                ...github.rest,
                users: { ...github.rest.users, getAuthenticated: async () => ({ data: { login } }) },
              },
            };
            const appSlug = process.env.APP_SLUG;
            const log = (m) => core.info(m);

            // The poster rewrites the sticky summary on every run, and a run that
            // reviewed only the new commits reports only their findings. Findings
            // that lived only in the summary (routed by category, without a line,
            // or outside the diff) would then disappear, so a narrowed run keeps
            // them in a collapsed section until the next full review.
            const SEP = '\n\n---\n\n';
            // Split only where the poster starts a block: a finding (badge or
            // path heading), warnings, or a note. A rule inside a finding's own
            // text stays in that finding.
            const BLOCK = /\n\n---\n\n(?=!\[|### 📄 |⚠️ \*\*Warnings|ℹ️ )/;
            const EARLIER = '<!-- ocr-review-earlier -->';
            const isFinding = (block) => block.includes('### 📄 `');
            const earlierFindings = (body) => {
              const [own, carried = ''] = body.replace(/\r\n/g, '\n').split(EARLIER);
              const ownBlocks = own
                .replace(/\n\n<!-- ocr-checkpoint:v1 [A-Za-z0-9+/]+={0,2} -->/g, '')
                .replace(/\n\n_Reviewed `[0-9a-f]+\.\.[0-9a-f]+` only; earlier commits in this PR were reviewed in a previous run\._/g, '')
                .split(BLOCK)
                .slice(1);
              const carriedBlocks = carried.replace(/\n\n<\/details>\s*$/, '').split(BLOCK).slice(1);
              return [...new Set([...ownBlocks, ...carriedBlocks].map((b) => b.trim()).filter(isFinding))];
            };
            const narrowed = process.env.RANGE_MODE === 'checkpoint' && process.env.RANGE_REASON !== 'same_head_noop';
            let earlier = [];
            if (narrowed) {
              try {
                const old = await findExistingSummaryComment({ github: reviewer, ...target, prNumber, appSlug, log });
                earlier = earlierFindings(old?.body ?? '');
              } catch (e) {
                core.warning(`Could not read the summary before posting (${e.message}); its earlier findings are not kept.`);
              }
            }

            await runPostReviewComments({
              github: reviewer,
              context: reviewContext,
              core,
              fs,
              prNumber,
              resultPath: `${temp}/ocr-result.json`,
              stderrPath: `${temp}/ocr-stderr.log`,
              // One summary comment, rewritten each run. It carries the checkpoint.
              stickySummary: true,
              // Skip findings on lines an earlier OCR comment on this PR already
              // covers, resolved or not, so a later push does not raise them again.
              incremental: true,
              routeCategories: process.env.OCR_ROUTE_CATEGORIES,
              // The poster records a checkpoint only after a complete review
              // with every finding posted, and otherwise keeps the old one.
              checkpointEnabled: true,
              checkpointCarry: process.env.CHECKPOINT_CARRY,
              checkpointBaseRef: process.env.BASE_REF,
              checkpointMergeBase: process.env.MERGE_BASE,
              checkpointFingerprint: process.env.CHECKPOINT_FINGERPRINT,
              checkpointNoop: process.env.RANGE_REASON === 'same_head_noop',
              rangeMode: process.env.RANGE_MODE,
              rangeFrom: process.env.RANGE_FROM,
              rangeTo: process.env.HEAD_SHA,
              appSlug,
            });

            if (earlier.length) {
              let now = null;
              try {
                now = await findExistingSummaryComment({ github: reviewer, ...target, prNumber, appSlug, log });
              } catch (e) {
                core.warning(`Could not read the summary after posting (${e.message}).`);
              }
              if (!now) {
                core.warning(`${earlier.length} earlier summary finding(s) were not kept: no summary comment to add them to.`);
              } else {
                const section = (blocks) => `${SEP}${EARLIER}\n<details><summary>${blocks.length} finding(s) from earlier reviews of this pull request. They may be fixed since.</summary>${SEP}${blocks.join(SEP)}\n\n</details>`;
                // GitHub rejects a comment body over 65536 characters. Keep the
                // newest findings, which come first.
                let kept = earlier;
                while (kept.length && (now.body.length + section(kept).length) > 65536) kept = kept.slice(0, -1);
                if (kept.length < earlier.length) {
                  core.warning(`Dropped ${earlier.length - kept.length} earlier finding(s) to fit GitHub's comment size limit.`);
                }
                if (kept.length) {
                  try {
                    await reviewer.rest.issues.updateComment({ ...target, comment_id: now.id, body: now.body + section(kept) });
                    core.info(`Kept ${kept.length} earlier summary finding(s).`);
                  } catch (e) {
                    core.warning(`${kept.length} earlier summary finding(s) were not kept: ${e.message}`);
                  }
                }
              }
            }

      - name: Fail on review error
        if: steps.pr.outputs.review == 'true' && env.OCR_EXIT_CODE != '0'
        run: |
          echo "::error::ocr review exited with $OCR_EXIT_CODE; see the Run OCR step log."
          exit 1
